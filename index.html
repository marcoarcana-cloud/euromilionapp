&#x20; const {freqMain:fm, freqStar:fs}=calcolaFrequenze();

&#x20; const ma=(tot\*5/50).toFixed(2), ms=(tot\*2/12).toFixed(2);

&#x20; document.getElementById('mainAvg').textContent=ma; document.getElementById('starAvg').textContent=ms;

&#x20; let h='<div class="grid">';

&#x20; for(let n=1;n<=50;n++){let c=''; if(fm\[n]>parseFloat(ma)\*1.25)c='hot'; else if(fm\[n]<parseFloat(ma)\*0.75)c='cold';

&#x20;   h+=`<div><span class="num">${String(n).padStart(2,'0')}</span><br><span class="${c}">${fm\[n]} volte</span><div class="progress-bar"><div class="progress-fill" style="width:${Math.min(fm\[n]/ma\*100,150)}%;"></div></div></div>`;}

&#x20; h+='</div>'; document.getElementById('mainFreq').innerHTML=h;

&#x20; h='<div class="grid">';

&#x20; for(let n=1;n<=12;n++){let c=''; if(fs\[n]>parseFloat(ms)\*1.25)c='hot'; else if(fs\[n]<parseFloat(ms)\*0.75)c='cold';

&#x20;   h+=`<div><span class="num star">${String(n).padStart(2,'0')}</span><br><span class="${c}">${fs\[n]} volte</span><div class="progress-bar"><div class="progress-fill" style="width:${Math.min(fs\[n]/ms\*100,150)}%;"></div></div></div>`;}

&#x20; h+='</div>'; document.getElementById('starFreq').innerHTML=h;

&#x20; const {ritMain:rm, ritStar:rs}=calcolaRitardi();

&#x20; h='<div class="grid">';

&#x20; for(let n=1;n<=50;n++){h+=`<div><span class="num">${String(n).padStart(2,'0')}</span><br><span class="${rm\[n]>=10?'late':''}">${rm\[n]}</span><br><small>estrazioni</small></div>`;}

&#x20; h+='</div>'; document.getElementById('mainRitardo').innerHTML=h;

&#x20; h='<div class="grid">';

&#x20; for(let n=1;n<=12;n++){h+=`<div><span class="num star">${String(n).padStart(2,'0')}</span><br><span class="${rs\[n]>=8?'late':''}">${rs\[n]}</span><br><small>estrazioni</small></div>`;}

&#x20; h+='</div>'; document.getElementById('starRitardo').innerHTML=h;

&#x20; const top=\[...Array(51).keys()].slice(1).map(n=>({n,r:rm\[n]})).sort((a,b)=>b.r-a.r).slice(0,10);

&#x20; h='<tr><th>Posizione</th><th>Numero</th><th>Estrazioni dall\&apos;ultima uscita</th></tr>';

&#x20; top.forEach((x,i)=>h+=`<tr><td>${i+1}</td><td><b>${x.n}</b></td><td class="late">${x.r}</td></tr>`);

&#x20; document.getElementById('topRitardo').innerHTML=h;

&#x20; h='<table><tr><th>Data</th><th>Numeri</th><th>Stelle</th></tr>';

&#x20; estrazioni.slice(0,10).forEach(e=>h+=`<tr><td>${e.data}</td><td>${e.main.join(', ')}</td><td>${e.stars.join(', ')}</td></tr>`);

&#x20; h+='</table>'; document.getElementById('elencoEstrazioni').innerHTML=h;

&#x20; aggiornaSalvate();

}

function aggiornaSalvate(){

&#x20; if(combSalvate.length===0){document.getElementById('salvate').innerHTML='Nessuna combinazione salvata.'; return;}

&#x20; document.getElementById('salvate').innerHTML=combSalvate.map((c,i)=>`<div>${c.main.map(n=>`<span class="num" style="width:32px;height:32px;font-size:13px;">${String(n).padStart(2,'0')}</span>`).join('')} ⭐ ${c.stars.map(n=>`<span class="num star" style="width:32px;height:32px;font-size:13px;">${String(n).padStart(2,'0')}</span>`).join('')}<button class="red" style="padding:4px 8px; margin-left:auto;" onclick="rimuoviSalvata(${i})">✕</button></div>`).join('');

}

function salvaCombinazione(){

&#x20; const testo=document.getElementById('risultato').textContent;

&#x20; if(testo==='—' || !testo.trim()){alert('Genera prima una combinazione!'); return;}

&#x20; const t=testo.replace(/\[⭐\\s]+/g,' ').trim().split(' ').filter(p=>p);

&#x20; if(t.length===7){combSalvate.push({main:t.slice(0,5).map(Number), stars:t.slice(5,7).map(Number)}); salvaCombinazioni(); aggiornaSalvate(); alert('Combinazione salvata!');}

&#x20; else alert('Genera una combinazione valida prima di salvare.');

}

function rimuoviSalvata(i){if(confirm('Eliminare questa combinazione?')){combSalvate.splice(i,1); salvaCombinazioni(); aggiornaSalvate();}}

function pescaUnici(lista,quanti,pesi=null){

&#x20; const res=\[], disp=\[...lista], w=pesi?\[...pesi]:disp.map(()=>1);

&#x20; for(let i=0;i<quanti;i++){let s=w.reduce((a,b)=>a+b,0), r=Math.random()\*s; for(let j=0;j<disp.length;j++){r-=w\[j]; if(r<=0){res.push(disp\[j]); disp.splice(j,1); w.splice(j,1); break;}}}

&#x20; return res.sort((a,b)=>a-b);

}

function genera(){

&#x20; const {freqMain:fm, freqStar:fs}=calcolaFrequenze();

&#x20; const {ritMain:rm, ritStar:rs}=calcolaRitardi();

&#x20; const m=document.getElementById('metodo').value;

&#x20; let num, st;

&#x20; if(m==='caldi'){

&#x20;   num=pescaUnici(\[...Array(51).keys()].slice(1).sort((a,b)=>fm\[b]-fm\[a]).slice(0,20),5);

&#x20;   st=pescaUnici(\[...Array(13).keys()].slice(1).sort((a,b)=>fs\[b]-fs\[a]).slice(0,6),2);

&#x20; } else if(m==='freddi'){

&#x20;   num=pescaUnici(\[...Array(51).keys()].slice(1).sort((a,b)=>fm\[a]-fm\[b]).slice(0,20),5);

&#x20;   st=pescaUnici(\[...Array(13).keys()].slice(1).sort((a,b)=>fs\[a]-fs\[b]).slice(0,6),2);

&#x20; } else if(m==='ritardo'){

&#x20;   num=pescaUnici(\[...Array(51).keys()].slice(1).sort((a,b)=>rm\[b]-rm\[a]).slice(0,20),5);

&#x20;   st=pescaUnici(\[...Array(13).keys()].slice(1).sort((a,b)=>rs\[b]-rs\[a]).slice(0,6),2);

&#x20; } else if(m==='misto'){

&#x20;   const c=\[...Array(51).keys()].slice(1).sort((a,b)=>fm\[b]-fm\[a]).slice(0,15);

&#x20;   const r=\[...Array(51).keys()].slice(1).sort((a,b)=>rm\[b]-rm\[a]).slice(0,15);

&#x20;   num=pescaUnici(\[...new Set(\[...c,...r])],5);

&#x20;   const cs=\[...Array(13).keys()].slice(1).sort((a,b)=>fs\[b]-fs\[a]).slice(0,6);

&#x20;   const rs\_=\[...Array(13).keys()].slice(1).sort((a,b)=>rs\[b]-rs\[a]).slice(0,6);

&#x20;   st=pescaUnici(\[...new Set(\[...cs,...rs\_])],2);

&#x20; } else {num=pescaUnici(\[...Array(51).keys()].slice(1),5); st=pescaUnici(\[...Array(13).keys()].slice(1),2);}

&#x20; document.getElementById('risultato').innerHTML=num.map(n=>`<span class="num">${String(n).padStart(2,'0')}</span>`).join('')+' \&nbsp; ⭐ '+st.map(n=>`<span class="num star">${String(n).padStart(2,'0')}</span>`).join('');

}

function calcolaPremi(ng, sg, nu, su){

&#x20; const c=ng.filter(x=>nu.includes(x)).length, cs=sg.filter(x=>su.includes(x)).length;

&#x20; if(c===5\&\&cs===2)return{l:1,n:"🏆 Jackpot"}; if(c===5\&\&cs===1)return{l:2,n:"🥈 5+1 Stella"}; if(c===5\&\&cs===0)return{l:3,n:"🥉 5+0 Stelle"};

&#x20; if(c===4\&\&cs===2)return{l:4,n:"4+2 Stelle"}; if(c===4\&\&cs===1)return{l:5,n:"4+1 Stella"}; if(c===3\&\&cs===2)return{l:6,n:"3+2 Stelle"};

&#x20; if(c===4\&\&cs===0)return{l:7,n:"4+0 Stelle"}; if(c===3\&\&cs===1)return{l:8,n:"3+1 Stella"}; if(c===2\&\&cs===2)return{l:9,n:"2+2 Stelle"};

&#x20; if(c===3\&\&cs===0)return{l:10,n:"3+0 Stelle"}; if(c===2\&\&cs===1)return{l:11,n:"2+1 Stella"}; if(c===1\&\&cs===2)return{l:12,n:"1+2 Stelle"};

&#x20; if(c===2\&\&cs===0)return{l:13,n:"2+0 Stelle"}; return{l:0,n:"Nessun premio"};

}

function verifica(){

&#x20; const n=\[1,2,3,4,5].map(i=>parseInt(document.getElementById('v'+i).value)).filter(x=>!isNaN(x));

&#x20; const s=\[1,2].map(i=>parseInt(document.getElementById('s'+i).value)).filter(x=>!isNaN(x));

&#x20; if(n.length!==5||s.length!==2){document.getElementById('verificaRisultato').innerHTML='<span style="color:red;">❌ Inserisci tutti i numeri correttamente!</span>';return;}

&#x20; if(new Set(n).size!==5||new Set(s).size!==2){document.getElementById('verificaRisultato').innerHTML='<span style="color:red;">❌ Numeri duplicati!</span>';return;}

&#x20; const v=\[]; estrazioni.forEach(e=>{const p=calcolaPremi(n,s,e.main,e.stars); if(p.l>0)v.push({d:e.data,...p});});

&#x20; document.getElementById('verificaRisultato').innerHTML=v.length?`<b>✅ ${v.length} corrispondenze trovate:</b><br>${v.map(x=>x.d+' — '+x.n).join('<br>')}':'Nessuna corrispondenza trovata su ${estrazioni.length} estrazioni.';

}

function verificaTutte(){

&#x20; if(!combSalvate.length)return alert('Nessuna combinazione salvata!');

&#x20; document.getElementById('verificaSalvate').innerHTML=combSalvate.map((c,i)=>{

&#x20;   const v=\[]; estrazioni.forEach(e=>{const p=calcolaPremi(c.main,c.stars,e.main,e.stars); if(p.l>0)v.push(e.data+' — '+p.n);});

&#x20;   return `<div style="padding:10px; background:${v.length?'#e8f5e9':'#f5f5f5'}; border-radius:8px; margin:6px 0;">Combinazione ${i+1}: ${c.main.join(', ')} | ⭐ ${c.stars.join(', ')} ${v.length?`<br><b>${v.length} corrispondenze:</b><br>${v.join('<br>')}`:'<br>Nessuna corrispondenza trovata'}</div>`;

&#x20; }).join('');

}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{

&#x20; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));

&#x20; document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));

&#x20; t.classList.add('active'); document.getElementById(t.dataset.tab).classList.add('active');

}));

window.onload=caricaDati;
